spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/urban_oasis}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Hibernate only validates that the schema matches the entities; it no longer
      # creates or alters tables. Schema changes now go through Flyway migrations
      # (see db/migration). JPA_DDL_AUTO still allows overriding this per-environment
      # if ever needed.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
  # Flyway now owns schema migrations. baseline-on-migrate + baseline-version=1 let
  # the existing production database (already at the V1 schema) adopt Flyway
  # without re-running V1 against it.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

overpass:
  sync:
    cron: "0 0 3,15 * * *"

admin:
  api-key: ${ADMIN_API_KEY:}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
