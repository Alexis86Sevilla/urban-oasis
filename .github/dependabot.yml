version: 2

updates:
  # Backend (Maven). Grouped so routine bumps arrive as one PR instead of many.
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(backend)"
    groups:
      backend-minor-and-patch:
        update-types:
          - minor
          - patch

  # Frontend (pnpm lockfile, handled by the npm ecosystem).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(frontend)"
    groups:
      frontend-minor-and-patch:
        update-types:
          - minor
          - patch

  # The deploy workflow's own actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
